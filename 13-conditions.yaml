- name: Check num of live sessions
  hosts: local
  connection: local
  # vars:
  #   live_sessions: 6
  vars_prompt:
    name: live_sessions
    prompt: 'Please enter no of live sessions'
    private: false
  tasks:
  - name: is ansible more than 5 sessions
    debug:
      msg: 'Yes, Ansible has more than 5 sessions'
    when: {{ live_sessions }} > 5