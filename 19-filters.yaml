- name: Demo on filters
  hosts: local
  connection: local
  vars:
    topics: Linux, Shell, Ansible, Terraform
    tagMap:
      name: Ansible
      project: robotshop
      env: dev
  tasks:
  - name: Conver string to list
    debug:
      msg: "Topics are: {{ topics | split(',') }}"
  
  - name: "Set default values"
    debug:
      msg: "HI {{ GREETING | default('Good morning')}}"

  - namme: Convert map to list
    debug:
      msg: {{ tagMap | dict2items}}